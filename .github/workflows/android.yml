name: APK & Windows bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # für Releases

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Fester Signaturschlüssel aus den Repo-Secrets, damit Updates sich über die alte App installieren lassen.
      # Ohne Secrets wird mit einem Wegwerf-Debug-Schlüssel signiert (zum Testen ok, Updates dann nur nach Deinstallation).
      - name: Keystore aus Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.HAS_KEYSTORE == 'true'
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Release-APK bauen
        env:
          SIGNING_STORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: |
          NAME="${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

  # Windows-Version (Compose for Desktop): MSI-Installer + ZIP zum Entpacken ohne Installation
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: MSI und ZIP bauen
        env:
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew -p desktop --no-daemon packageMsi createDistributable

      - name: Dateien umbenennen
        run: |
          BASE="${GITHUB_REPOSITORY#*/}-windows-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}"
          cp desktop/build/compose/binaries/main/msi/*.msi "$BASE.msi"
          (cd desktop/build/compose/binaries/main/app && 7z a -tzip "$GITHUB_WORKSPACE/$BASE.zip" Weinkeller > /dev/null)
          echo "WIN_BASE=$BASE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WIN_BASE }}
          path: |
            ${{ env.WIN_BASE }}.msi
            ${{ env.WIN_BASE }}.zip
          retention-days: 30

  # Jeder Push (oder manuelle Start) auf main erzeugt automatisch ein Release (v1.0.<Build-Nr.>) mit APK und
  # Windows-Dateien; eigene Tags (v1.1 …) ebenso
  release:
    needs: [android, windows]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Weinkeller v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.apk
            dist/*.msi
            dist/*.zip
          generate_release_notes: true
          make_latest: true
