name: APK bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # für Releases bei Tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Fester Signaturschlüssel aus den Repo-Secrets, damit Updates sich über die alte App installieren lassen.
      # Ohne Secrets wird mit einem Wegwerf-Debug-Schlüssel signiert (zum Testen ok, Updates dann nur nach Deinstallation).
      - name: Keystore aus Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.HAS_KEYSTORE == 'true'
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Release-APK bauen
        env:
          SIGNING_STORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      # Google Play: App-Bundle (.aab), nur mit eigenem Schlüssel – Google lehnt Debug-signierte Bundles ab
      - name: Play-Bundle bauen
        if: env.HAS_KEYSTORE == 'true'
        env:
          SIGNING_STORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew --no-daemon bundleRelease

      - name: APK umbenennen
        run: |
          NAME="${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            AAB="${NAME%.apk}-PlayStore.aab"
            cp app/build/outputs/bundle/release/app-release.aab "$AAB"
            echo "AAB_NAME=$AAB" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.AAB_NAME }}
          retention-days: 30

      # Automatisch in den internen Test von Google Play. Braucht das Secret PLAY_SERVICE_ACCOUNT_JSON
      # (Dienstkonto mit Release-Rechten in der Play Console). Die erste Version muss von Hand hochgeladen werden.
      # Schlägt der Upload fehl, gibt es nur eine Warnung – das GitHub-Release kommt trotzdem.
      - name: Upload in Google Play (interner Test)
        if: env.AAB_NAME != '' && env.HAS_PLAY_JSON == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.robin.wein
          releaseFiles: ${{ env.AAB_NAME }}
          track: internal
          # "draft", solange die App noch nie ausgerollt wurde
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

      # Jeder Push (oder manuelle Start) auf main erzeugt automatisch ein Release (v1.0.<Build-Nr.>); eigene Tags (v1.1 …) ebenso
      - name: Release anlegen
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Weinkeller v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.APK_NAME }}
            ${{ env.AAB_NAME }}
          generate_release_notes: true
          make_latest: true
